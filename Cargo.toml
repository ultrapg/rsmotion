[workspace]
resolver = "2"
members = [
    "crates/rsmotion-core",
    "crates/rsmotion-analyze",
    "crates/rsmotion-encode",
    "crates/rsmotion-media",
    "crates/rsmotion-scene",
    "crates/rsmotion-css",
    "crates/rsmotion-js",
    "crates/rsmotion-layout",
    "crates/rsmotion-raster",
    "crates/rsmotion-cdp",
    "crates/rsmotion-bundler",
    "crates/rsmotion-cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/ultrapg/rsmotion"
homepage = "https://github.com/ultrapg/rsmotion"
description = "High-performance pure-Rust video renderer and Rolldown bundler for Remotion compositions"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
cssparser = "0.38.0"
deno_core = "0.413.0"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
khronos-egl = { version = "6.0", features = ["dynamic"] }
libloading = "0.8"
memmap2 = "0.9"
png = "0.17"
rolldown = "1.3.2"
rsmotion-analyze = { path = "crates/rsmotion-analyze" }
rsmotion-bundler = { path = "crates/rsmotion-bundler" }
rsmotion-cdp = { path = "crates/rsmotion-cdp" }
rsmotion-core = { path = "crates/rsmotion-core" }
rsmotion-css = { path = "crates/rsmotion-css" }
rsmotion-encode = { path = "crates/rsmotion-encode" }
rsmotion-js = { path = "crates/rsmotion-js" }
rsmotion-layout = { path = "crates/rsmotion-layout" }
rsmotion-media = { path = "crates/rsmotion-media" }
rsmotion-raster = { path = "crates/rsmotion-raster" }
rsmotion-scene = { path = "crates/rsmotion-scene" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
skia-safe = { version = "0.157.0", features = ["gl", "egl", "vulkan", "x11", "wayland", "textlayout", "svg", "skottie", "webp", "no-compile"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "flac", "pcm", "vorbis", "alac", "opt-simd"] }
taffy = "0.15.1"
thiserror = "2.0"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3.5.2"
url = "2"
wuff = "0.2.10"
